databases:
  - name: nairobi-db
    plan: free
    databaseName: nairobi_platform
    user: nairobi_user

services:
  # Backend API
  - type: web
    name: nairobi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: nairobi-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nairobi-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://nairobi-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Frontend Static Site
  - type: web
    name: nairobi-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://nairobi-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
